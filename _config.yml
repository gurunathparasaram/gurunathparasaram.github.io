# ------------------------------------------------------------------
# Site settings. Restart `bundle exec jekyll serve` after editing.
# ------------------------------------------------------------------
title: Gurunath Parasaram
description: AI Engineer. Production ML and LLM systems, agentic AI, healthcare AI.
url: https://gurunathparasaram.github.io
baseurl: ""
lang: en
theme: null  # no gem theme; all layouts live in this repo
author:
  name: Gurunath Parasaram

# Twitter / X handle WITHOUT the "@" (for example: gurunath). Leave empty
# until you have one: the Life > Feed page then shows a short note instead.
twitter_handle: ""

# Show the travel world map (self-hosted SVG, no third-party requests).
travel_map: true

# Mode used on a visitor's first visit: "plain" or "game".
default_mode: plain

# ------------------------------------------------------------------
# Jekyll / GitHub Pages
# ------------------------------------------------------------------
markdown: kramdown
kramdown:
  input: GFM
  auto_ids: true
permalink: /blog/:year/:month/:day/:title/

plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-redirect-from

defaults:
  - scope: { path: "", type: posts }
    values: { layout: post, level: blog }

exclude:
  - README.md
  - AGENTS.md
  - LICENSE
  - Gemfile
  - Gemfile.lock
  - vendor
  - node_modules
