<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<script>
  /* Set mode and theme before first paint to avoid a flash. Storage can throw (private mode), so wrap it. */
  (function () {
    var d = document.documentElement, mode = null, theme = null;
    try { mode = localStorage.getItem('gp-mode'); theme = localStorage.getItem('gp-theme'); } catch (e) {}
    try {
      var q = new URLSearchParams(location.search).get('mode');
      if (q === 'game' || q === 'plain') { mode = q; try { localStorage.setItem('gp-mode', q); } catch (e) {} }
    } catch (e) {}
    if (mode !== 'game' && mode !== 'plain') mode = '{{ site.default_mode | default: "plain" }}';
    d.setAttribute('data-mode', mode);
    if (theme === 'light' || theme === 'dark') d.setAttribute('data-theme', theme);
    d.className = d.className.replace('no-js', 'js');
  })();
</script>
