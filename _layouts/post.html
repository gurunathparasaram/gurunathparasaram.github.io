---
layout: default
---
<article class="post prose">
  <p class="eyebrow"><a href="{{ '/blog/' | relative_url }}">← Blog</a></p>
  <h1 class="page-title">{{ page.title }}</h1>
  <p class="post-meta">
    <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%B %-d, %Y" }}</time>
    {%- assign words = content | number_of_words -%} · {{ words | divided_by: 200 | plus: 1 }} min read
    {%- if page.tags.size > 0 %} · {% for t in page.tags %}<span class="tag">{{ t }}</span>{% endfor %}{% endif %}
  </p>
  {{ content }}
</article>
